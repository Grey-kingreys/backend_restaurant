# supervisord — fait tourner gunicorn + Celery worker + Celery beat dans UN seul conteneur.
# Démarrage auto, redémarrage auto si un process crashe, logs redirigés vers stdout/stderr
# (donc visibles dans les logs Dokploy). Celery est activable/désactivable via RUN_CELERY.
#
# ⚠️ beat = planificateur : ne PAS scaler ce conteneur au-delà de 1 réplique, sinon
#    plusieurs beat = tâches périodiques dupliquées.

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

# ── Serveur web (toujours actif) ──────────────────────────────────────────
[program:gunicorn]
command=gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers %(ENV_GUNICORN_WORKERS)s --timeout 120
directory=/app
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Celery worker — exécute les tâches (activé si RUN_CELERY=true) ─────────
[program:celery-worker]
command=celery -A backend worker --loglevel=info
directory=/app
autostart=%(ENV_RUN_CELERY)s
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Celery beat — planifie les tâches périodiques (activé si RUN_CELERY=true) ──
[program:celery-beat]
command=celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app
autostart=%(ENV_RUN_CELERY)s
autorestart=true
startretries=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
